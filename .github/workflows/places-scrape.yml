name: Google Places Scrape

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "true = sadece 3 il ile test, false = tam 81 il"
        required: false
        default: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (test mode)
        if: ${{ inputs.test_mode == 'true' }}
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python google_places_scraper.py --test

      - name: Run scraper (full run)
        if: ${{ inputs.test_mode == 'false' }}
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python google_places_scraper.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: places-results
          path: |
            places_summary.csv
            places_raw/
